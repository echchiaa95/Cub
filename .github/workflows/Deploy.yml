
name: Deploy Coach Tactics Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract ZIP
      - name: Extract project ZIP
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/coach-project"
          mkdir -p "$PROJECT_DIR"

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d "$PROJECT_DIR"
          else
            cp -R . "$PROJECT_DIR/"
          fi

          PACKAGE=$(find "$PROJECT_DIR" -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$PACKAGE" ]; then
            APP_DIR=$(dirname "$PACKAGE")
            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
            echo "Project: $APP_DIR"
          else
            INDEX=$(find "$PROJECT_DIR" -type f \
              -name "index.html" | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: No project found."
              exit 1
            fi

            APP_DIR=$(dirname "$INDEX")
            echo "type=static" >> "$GITHUB_OUTPUT"
            echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          fi

      # 3. Setup Node.js
      - name: Setup Node.js
        if: steps.project.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup npm
      - name: Setup npm
        if: steps.project.outputs.type == 'node'
        run: |
          npm install -g npm@10.8.2
          node --version
          npm --version

      # 5. Install project dependencies
      - name: Install project dependencies
        if: steps.project.outputs.type == 'node'
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npm install \
            --include=dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund
        env:
          CI: true

      # 6. Install correct build dependencies
      - name: Install build dependencies
        if: steps.project.outputs.type == 'node'
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          npm install --no-save \
            --include=dev \
            --package-lock=false \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            typescript@5.8.3 \
            vite@^6 \
            vite-plugin-pwa@^0.21 \
            vitest@^3

      # 7. Verify actual compiler and packages
      - name: Verify build tools
        if: steps.project.outputs.type == 'node'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "Checking TypeScript..."

          test -f node_modules/typescript/bin/tsc
          node node_modules/typescript/bin/tsc --version

          echo "Checking Vite..."

          test -f node_modules/vite/bin/vite.js
          node node_modules/vite/bin/vite.js --version

          echo "Checking PWA..."

          node -e "console.log(require.resolve('vite-plugin-pwa'))"

          echo "Checking Vitest..."

          node -e "console.log(require.resolve('vitest/config'))"

          echo "All build tools are installed."

      # 8. Build application
      - name: Build application
        if: steps.project.outputs.type == 'node'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          echo "Repository: $REPO_NAME"
          echo "Base: /$REPO_NAME/"

          echo "Running TypeScript compiler..."

          node node_modules/typescript/bin/tsc -b

          echo "Building Vite..."

          node node_modules/vite/bin/vite.js build \
            --base="/$REPO_NAME/"

          test -f dist/index.html

          echo "BUILD SUCCESSFUL"

      # 9. Prepare website
      - name: Prepare deployment
        id: output
        shell: bash
        run: |
          set -e

          APP_DIR="${{ steps.project.outputs.dir }}"
          OUTPUT="$RUNNER_TEMP/website"

          mkdir -p "$OUTPUT"

          if [ "${{ steps.project.outputs.type }}" = "node" ]; then
            SOURCE="$APP_DIR/dist"
          else
            SOURCE="$APP_DIR"
          fi

          test -f "$SOURCE/index.html"

          cp -R "$SOURCE"/. "$OUTPUT"/

          echo "Published files:"
          find "$OUTPUT" -maxdepth 3 -type f

          echo "dir=$OUTPUT" >> "$GITHUB_OUTPUT"

      # 10. Configure Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 11. Upload website
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.dir }}

  # 12. Deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
