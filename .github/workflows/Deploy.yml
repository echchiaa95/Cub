
name: Deploy Coach Tactics Pro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project directory
        id: app
        run: |
          FILE=$(find . -maxdepth 5 -type f -name package.json \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: package.json was not found."
            echo "Check the uploaded project files."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm install

      - name: Build application
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.app.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
