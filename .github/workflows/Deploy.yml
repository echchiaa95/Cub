
name: Deploy ZIP Project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        id: project
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./extracted/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
          else
            echo "No ZIP found. Checking repository files."
            cp -R . extracted/source
          fi

          PACKAGE=$(find extracted -type f -name package.json \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$PACKAGE" ]; then
            APP_DIR=$(dirname "$PACKAGE")
            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          else
            INDEX=$(find extracted -type f -name index.html | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: No package.json or index.html found."
              exit 1
            fi

            APP_DIR=$(dirname "$INDEX")
            echo "type=static" >> "$GITHUB_OUTPUT"
            echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          fi

          echo "Project directory: $APP_DIR"

      - name: Setup Node.js
        if: steps.project.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.project.outputs.type == 'node'
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Build application
        if: steps.project.outputs.type == 'node'
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Select deployment folder
        id: output
        run: |
          if [ "${{ steps.project.outputs.type }}" = "node" ]; then
            APP="${{ steps.project.outputs.dir }}"

            if [ -d "$APP/dist" ]; then
              OUT="$APP/dist"
            elif [ -d "$APP/build" ]; then
              OUT="$APP/build"
            else
              echo "ERROR: Build output folder not found."
              exit 1
            fi
          else
            OUT="${{ steps.project.outputs.dir }}"
          fi

          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "Deploying: $OUT"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
